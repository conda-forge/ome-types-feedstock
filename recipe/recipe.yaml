schema_version: 1

context:
  name: ome-types
  version: "0.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ome_types-${{ version }}.tar.gz
  sha256: 50730f90dd17c3fe4305f15ff0990d2b431df684bb1551312d4cd3f0bc35e584

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - hatch-vcs
    - pip
    - pydantic >=2.4.0
    - pydantic-extra-types >=2.0.0
    - ruff ==0.13.2
    - xsdata >=26.1,<27
  run:
    - python >=${{ python_min }}
    - pydantic >=2.4.0
    - pydantic-extra-types >=2.0.0
    - xsdata >=26.1,<27
    - lxml >=5.0
    - pint >=0.15

tests:
  - python:
      imports:
        - ome_types
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python dataclasses for the OME data model
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/imaging-formats/ome-types
  repository: https://github.com/imaging-formats/ome-types
  documentation: https://ome-types.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - imagejan
    - tlambert03
